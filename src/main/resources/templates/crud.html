<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CRUD – Town Management</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>

<div th:replace="~{navbar :: navbar}"></div>

<div class="container mt-5">

    <h2 class="mb-4 text-center">Town Management (CRUD)</h2>

    <a class="btn btn-primary mb-3" th:href="@{/crud/add}">+ Add New Town</a>

    <table class="table table-striped table-hover shadow">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>County</th>
            <th>Seat</th>
            <th>Level</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="t : ${towns}">
            <td th:text="${t.id}"></td>
            <td th:text="${t.tname}"></td>
            <td th:text="${t.countyid}"></td>
            <td th:text="${t.countyseat}"></td>
            <td th:text="${t.countylevel}"></td>

            <td>
                <a class="btn btn-warning btn-sm"
                   th:href="@{'/crud/edit/' + ${t.id}}">
                    Edit
                </a>

                <a class="btn btn-danger btn-sm"
                   th:href="@{'/crud/delete/' + ${t.id}}"
                   onclick="return confirm('Delete this town?')">
                    Delete
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
